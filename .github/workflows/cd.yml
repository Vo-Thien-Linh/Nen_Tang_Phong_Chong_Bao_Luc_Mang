name: WINGS Social CD Pipeline

on:
  # Tự động kích hoạt khi pipeline CI hoàn tất thành công trên main, master hoặc develop
  workflow_run:
    workflows: ["WINGS Social CI Pipeline"]
    types: [completed]
    branches:
      - main
      - master
      - develop

  # Kích hoạt khi có release tag mới (ví dụ: v1.0.0, v2.1.0)
  push:
    tags:
      - 'v*'

  # Cho phép kích hoạt thủ công từ giao diện GitHub Actions với các tùy chọn linh hoạt
  workflow_dispatch:
    inputs:
      environment:
        description: 'Môi trường triển khai'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      deploy_strategy:
        description: 'Kiến trúc triển khai'
        required: true
        default: 'docker-compose-monolith'
        type: choice
        options:
          - docker-compose-monolith
          - docker-compose-microservices
          - build-only
      run_migrations:
        description: 'Chạy Database Migration trước khi triển khai'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ========================================================
  # JOB 1: CHUẨN BỊ & XÁC ĐỊNH MÔI TRƯỜNG TRIỂN KHAI
  # ========================================================
  prepare:
    name: 🔍 Xác định Môi trường & Phiên bản
    runs-on: ubuntu-latest
    # Chỉ chạy nếu kích hoạt thủ công, qua tag, hoặc khi CI trước đó thành công
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      deploy_env: ${{ steps.env_detect.outputs.deploy_env }}
      image_tag: ${{ steps.env_detect.outputs.image_tag }}
      owner_lc: ${{ steps.env_detect.outputs.owner_lc }}
      should_migrate: ${{ steps.env_detect.outputs.should_migrate }}
      deploy_strategy: ${{ steps.env_detect.outputs.deploy_strategy }}
      target_branch: ${{ steps.env_detect.outputs.target_branch }}

    steps:
      - name: 📥 Tải mã nguồn từ GitHub
        uses: actions/checkout@v4

      - name: 🎯 Thiết lập thông số Môi trường
        id: env_detect
        run: |
          # 1. Chuyển đổi tên repository owner thành chữ thường (chuẩn OCI / Docker)
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lc=$OWNER_LC" >> $GITHUB_OUTPUT

          # 2. Xác định branch mục tiêu
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            TARGET_BRANCH="${{ github.event.workflow_run.head_branch }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_BRANCH="${{ github.ref_name }}"
          else
            TARGET_BRANCH="${{ github.ref_name }}"
          fi
          echo "target_branch=$TARGET_BRANCH" >> $GITHUB_OUTPUT

          # 3. Xác định môi trường (Production vs Staging)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DEPLOY_ENV="${{ github.event.inputs.environment }}"
            STRATEGY="${{ github.event.inputs.deploy_strategy }}"
            MIGRATE="${{ github.event.inputs.run_migrations }}"
          elif [ "$TARGET_BRANCH" = "main" ] || [ "$TARGET_BRANCH" = "master" ] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            DEPLOY_ENV="production"
            STRATEGY="docker-compose-monolith"
            MIGRATE="true"
          else
            DEPLOY_ENV="staging"
            STRATEGY="docker-compose-monolith"
            MIGRATE="true"
          fi

          echo "deploy_env=$DEPLOY_ENV" >> $GITHUB_OUTPUT
          echo "deploy_strategy=$STRATEGY" >> $GITHUB_OUTPUT
          echo "should_migrate=$MIGRATE" >> $GITHUB_OUTPUT

          # 4. Xác định Image Tag (Release Tag hoặc Short SHA)
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            IMG_TAG="${GITHUB_REF#refs/tags/}"
          else
            IMG_TAG=$(git rev-parse --short HEAD)
          fi
          echo "image_tag=$IMG_TAG" >> $GITHUB_OUTPUT

          echo "✅ Đã xác định:"
          echo "  - Môi trường: $DEPLOY_ENV"
          echo "  - Chiến lược: $STRATEGY"
          echo "  - Image Tag: $IMG_TAG"
          echo "  - Registry Owner: $OWNER_LC"
          echo "  - Chạy migration: $MIGRATE"

  # ========================================================
  # JOB 2: TỰ ĐỘNG CHẠY DATABASE MIGRATION (NẾU CÓ SECRET)
  # ========================================================
  database-migration:
    name: 🗄️ Database Migration
    needs: prepare
    if: needs.prepare.outputs.should_migrate == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Tải mã nguồn từ GitHub
        uses: actions/checkout@v4

      - name: ⚙️ Cài đặt môi trường Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: 📦 Cài đặt thư viện Backend
        working-directory: backend
        run: npm ci || npm install

      - name: 🚀 Thực thi Database Migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "🚀 Đang thực thi migration trên cơ sở dữ liệu đích..."
            npm run migrate
            echo "✅ Hoàn tất migration thành công!"
          else
            echo "ℹ️ Biến bí mật DATABASE_URL chưa được cấu hình. Bỏ qua bước migration tự động."
          fi
        working-directory: backend

  # ========================================================
  # JOB 3: XÂY DỰNG & ĐẨY DOCKER IMAGES (GHCR)
  # ========================================================
  build-and-push-images:
    name: 🐳 Build & Push ${{ matrix.service.name }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: gateway
            dockerfile: docker/Dockerfile.gateway
            context: .
          - name: frontend
            dockerfile: frontend/Dockerfile
            context: .
          - name: express-backend
            dockerfile: docker/Dockerfile.express
            context: .
          - name: fastapi-backend
            dockerfile: docker/Dockerfile.fastapi
            context: .
          - name: ai-service
            dockerfile: docker/Dockerfile.ai-service
            context: .
          - name: user-service
            dockerfile: docker/Dockerfile.user-service
            context: .
          - name: post-service
            dockerfile: docker/Dockerfile.post-service
            context: .
          - name: moderation-service
            dockerfile: docker/Dockerfile.moderation-service
            context: .
          - name: notification-service
            dockerfile: docker/Dockerfile.notification-service
            context: .

    steps:
      - name: 📥 Tải mã nguồn từ GitHub
        uses: actions/checkout@v4

      - name: ⚙️ Thiết lập Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Đăng nhập GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Khởi tạo Tags cho Docker Image
        id: meta
        run: |
          IMAGE_NAME="ghcr.io/${{ needs.prepare.outputs.owner_lc }}/wings-${{ matrix.service.name }}"
          TAG_SHA="${IMAGE_NAME}:${{ needs.prepare.outputs.image_tag }}"
          TAG_ENV="${IMAGE_NAME}:${{ needs.prepare.outputs.deploy_env }}"
          
          TAGS="${TAG_SHA},${TAG_ENV}"
          if [ "${{ needs.prepare.outputs.deploy_env }}" = "production" ]; then
            TAGS="${TAGS},${IMAGE_NAME}:latest"
          fi
          
          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT

      - name: 🏗️ Xây dựng & Đẩy Image lên GHCR
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PUBLIC_API_URL=${{ vars.PUBLIC_API_URL || 'http://localhost:5000' }}
            VITE_API_URL=${{ vars.PUBLIC_API_URL || 'http://localhost:5000' }}
            VITE_FASTAPI_URL=${{ vars.PUBLIC_API_URL || 'http://localhost:5000' }}

  # ========================================================
  # JOB 4: TRIỂN KHAI LÊN MÁY CHỦ (SSH / DOCKER COMPOSE)
  # ========================================================
  deploy-to-server:
    name: 🚀 Triển khai Máy chủ (${{ needs.prepare.outputs.deploy_env }})
    needs: [prepare, database-migration, build-and-push-images]
    if: needs.prepare.outputs.deploy_strategy != 'build-only'
    runs-on: ubuntu-latest
    env:
      HAS_SSH_SECRETS: ${{ secrets.SERVER_HOST != '' && secrets.SERVER_SSH_KEY != '' }}

    steps:
      - name: 📥 Tải mã nguồn từ GitHub
        uses: actions/checkout@v4

      - name: 🚀 Thực thi Triển khai qua SSH (Khi đã cấu hình Secrets)
        if: env.HAS_SSH_SECRETS == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          envs: |
            TARGET_BRANCH=${{ needs.prepare.outputs.target_branch }}
            DEPLOY_STRATEGY=${{ needs.prepare.outputs.deploy_strategy }}
            GITHUB_ACTOR=${{ github.actor }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.SERVER_DEPLOY_PATH || '/var/www/wings-social' }}"
            echo "🚀 Đang triển khai tại thư mục: $DEPLOY_PATH..."
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            # Đăng nhập GHCR
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            # Cập nhật mã nguồn git nếu có
            if [ -d .git ]; then
              echo "🔄 Đang cập nhật mã nguồn từ remote..."
              git fetch origin
              git checkout "$TARGET_BRANCH" || true
              git pull origin "$TARGET_BRANCH" || true
            fi

            # Lựa chọn file docker compose theo chiến lược
            if [ "$DEPLOY_STRATEGY" = "docker-compose-microservices" ]; then
              COMPOSE_FILE="docker-compose.microservices.yml"
            else
              COMPOSE_FILE="docker-compose.yml"
            fi
            echo "📦 Sử dụng cấu hình Compose: $COMPOSE_FILE"

            # Tải ảnh mới nhất và khởi động lại dịch vụ
            docker compose -f "$COMPOSE_FILE" pull || true
            docker compose -f "$COMPOSE_FILE" up -d --remove-orphans

            # Dọn dẹp docker images không dùng
            docker image prune -f

            echo "✅ Cụm dịch vụ Docker Compose đã được triển khai thành công!"

      - name: 🩺 Kiểm tra Sức khỏe Hệ thống (Healthcheck)
        if: env.HAS_SSH_SECRETS == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "🩺 Đang kiểm tra sức khỏe API Gateway và dịch vụ phụ trợ..."
            HEALTH_URL="${{ secrets.SERVER_HEALTH_URL || 'http://127.0.0.1:5000/api/health' }}"
            MAX_RETRIES=15
            INTERVAL=4
            SUCCESS=0

            for i in $(seq 1 $MAX_RETRIES); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || true)
              if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "207" ]; then
                echo "✅ Dịch vụ đã sẵn sàng! (HTTP $HTTP_CODE tại lần thử $i)"
                SUCCESS=1
                break
              fi
              echo "⏳ Đang chờ dịch vụ khởi động... (Lần thử $i/$MAX_RETRIES - HTTP $HTTP_CODE)"
              sleep $INTERVAL
            done

            if [ "$SUCCESS" -ne 1 ]; then
              echo "⚠️ Cảnh báo: Healthcheck không trả về HTTP 200/207 sau thời gian chờ!"
              exit 1
            fi

      - name: ℹ️ Hướng dẫn cấu hình Server SSH (Nếu chưa có Secret)
        if: env.HAS_SSH_SECRETS != 'true'
        run: |
          echo "=========================================================================="
          echo "ℹ️ THÔNG BÁO TỪ CD PIPELINE:"
          echo "Tất cả Docker Images đã được xây dựng và đẩy thành công lên GitHub Packages (GHCR)!"
          echo "Máy chủ chưa được kích hoạt triển khai tự động vì chưa cấu hình SSH Secrets."
          echo "Để kích hoạt tự động deploy lên VPS, hãy thêm các Secrets sau trong Repo Settings:"
          echo "  - SERVER_HOST: IP hoặc Domain của máy chủ"
          echo "  - SERVER_USER: Tên tài khoản SSH (ví dụ: ubuntu, debian, root)"
          echo "  - SERVER_SSH_KEY: Private SSH Key"
          echo "  - SERVER_DEPLOY_PATH: Thư mục chứa project trên máy chủ (ví dụ: /var/www/wings)"
          echo "  - DATABASE_URL: Chuỗi kết nối PostgreSQL / Supabase để chạy migration"
          echo "=========================================================================="

  # ========================================================
  # JOB 5: TỔNG HỢP KẾT QUẢ TRIỂN KHAI (STEP SUMMARY)
  # ========================================================
  summary:
    name: 📋 Báo cáo Kết quả CD
    needs: [prepare, database-migration, build-and-push-images, deploy-to-server]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📝 Tạo Báo cáo Tóm tắt GitHub Actions
        run: |
          STATUS="✅ THÀNH CÔNG"
          if [ "${{ needs.build-and-push-images.result }}" != "success" ] || \
             [ "${{ needs.deploy-to-server.result }}" = "failure" ]; then
            STATUS="❌ THẤT BÀI"
          fi

          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # 🚀 Báo cáo Triển khai WINGS Social CD Pipeline

          | Thông tin | Giá trị |
          | :--- | :--- |
          | **Trạng thái Pipeline** | **$STATUS** |
          | **Môi trường** | `${{ needs.prepare.outputs.deploy_env || 'N/A' }}` |
          | **Chiến lược** | `${{ needs.prepare.outputs.deploy_strategy || 'N/A' }}` |
          | **Nhánh mục tiêu** | `${{ needs.prepare.outputs.target_branch || github.ref_name }}` |
          | **Image Tag** | `${{ needs.prepare.outputs.image_tag || 'N/A' }}` |
          | **Registry** | `ghcr.io/${{ needs.prepare.outputs.owner_lc }}` |
          | **Database Migration** | `${{ needs.database-migration.result }}` |
          | **Build & Push Images** | `${{ needs.build-and-push-images.result }}` |
          | **Triển khai Máy chủ** | `${{ needs.deploy-to-server.result }}` |
          | **Người kích hoạt** | `@${{ github.actor }}` |

          ### 🐳 Danh sách Docker Images đã xuất bản trên GHCR:
          - `ghcr.io/${{ needs.prepare.outputs.owner_lc }}/wings-gateway:${{ needs.prepare.outputs.image_tag }}`
          - `ghcr.io/${{ needs.prepare.outputs.owner_lc }}/wings-frontend:${{ needs.prepare.outputs.image_tag }}`
          - `ghcr.io/${{ needs.prepare.outputs.owner_lc }}/wings-express-backend:${{ needs.prepare.outputs.image_tag }}`
          - `ghcr.io/${{ needs.prepare.outputs.owner_lc }}/wings-fastapi-backend:${{ needs.prepare.outputs.image_tag }}`
          - `ghcr.io/${{ needs.prepare.outputs.owner_lc }}/wings-ai-service:${{ needs.prepare.outputs.image_tag }}`
          - `ghcr.io/${{ needs.prepare.outputs.owner_lc }}/wings-user-service:${{ needs.prepare.outputs.image_tag }}`
          - `ghcr.io/${{ needs.prepare.outputs.owner_lc }}/wings-post-service:${{ needs.prepare.outputs.image_tag }}`
          - `ghcr.io/${{ needs.prepare.outputs.owner_lc }}/wings-moderation-service:${{ needs.prepare.outputs.image_tag }}`
          - `ghcr.io/${{ needs.prepare.outputs.owner_lc }}/wings-notification-service:${{ needs.prepare.outputs.image_tag }}`

          EOF
