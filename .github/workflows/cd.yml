name: WINGS Social CD Pipeline

on:
  # Tự động chạy khi CI thành công trên main / master / develop (chỉ với sự kiện push)
  workflow_run:
    workflows: ["WINGS Social CI Pipeline"]
    types: [completed]
    branches:
      - main
      - master
      - develop

  # Release tag (v1.0.0, ...) - chỉ chấp nhận tag nằm trên nhánh main
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      environment:
        description: 'Môi trường triển khai'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      deploy_strategy:
        description: 'Kiến trúc triển khai'
        required: true
        default: 'monolith'
        type: choice
        options:
          - monolith
          - microservices
          - build-only
      run_migrations:
        description: 'Chạy database/schema.sql + seed.sql + migrations (CHỈ khi DB mới, KHÔNG dùng cho DB đang có dữ liệu)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

env:
  # Checkout đúng commit đã vượt qua CI (workflow_run mặc định lấy nhánh mặc định)
  TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # ========================================================
  # JOB 1: XÁC ĐỊNH MÔI TRƯỜNG, TAG, DANH SÁCH IMAGE CẦN BUILD
  # ========================================================
  prepare:
    name: 🔍 Xác định môi trường & phiên bản
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    outputs:
      deploy_env: ${{ steps.detect.outputs.deploy_env }}
      strategy: ${{ steps.detect.outputs.strategy }}
      run_migrations: ${{ steps.detect.outputs.run_migrations }}
      image_tag: ${{ steps.detect.outputs.image_tag }}
      image_prefix: ${{ steps.detect.outputs.image_prefix }}
      matrix: ${{ steps.detect.outputs.matrix }}

    steps:
      - name: 📥 Tải mã nguồn
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: 🎯 Thiết lập thông số
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          REF: ${{ github.ref }}
          INPUT_ENV: ${{ inputs.environment }}
          INPUT_STRATEGY: ${{ inputs.deploy_strategy }}
          INPUT_MIGRATE: ${{ inputs.run_migrations }}
          REPO_STRATEGY: ${{ vars.DEPLOY_STRATEGY }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # Tag release phải nằm trên main để tránh deploy production từ nhánh chưa review
          if [[ "$REF" == refs/tags/* ]]; then
            git fetch origin main
            if ! git merge-base --is-ancestor "$TARGET_SHA" origin/main; then
              echo "::error::Tag ${REF#refs/tags/} không nằm trên nhánh main, từ chối deploy production."
              exit 1
            fi
          fi

          # Môi trường
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DEPLOY_ENV="$INPUT_ENV"
          elif [[ "$REF" == refs/tags/* ]] || [ "$HEAD_BRANCH" = "main" ] || [ "$HEAD_BRANCH" = "master" ]; then
            DEPLOY_ENV="production"
          else
            DEPLOY_ENV="staging"
          fi

          # Kiến trúc: input > repo variable DEPLOY_STRATEGY > monolith (docker-compose.yml)
          STRATEGY="monolith"
          [ -n "${REPO_STRATEGY:-}" ] && STRATEGY="$REPO_STRATEGY"
          [ "$EVENT_NAME" = "workflow_dispatch" ] && STRATEGY="$INPUT_STRATEGY"
          case "$STRATEGY" in monolith|microservices|build-only) ;; *)
            echo "::error::DEPLOY_STRATEGY không hợp lệ: $STRATEGY"; exit 1 ;;
          esac

          # Migration chỉ chạy khi người dùng chủ động chọn (schema.sql + seed.sql không idempotent an toàn)
          MIGRATE="false"
          [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_MIGRATE" = "true" ] && MIGRATE="true"

          # Image tag
          if [[ "$REF" == refs/tags/* ]]; then
            IMAGE_TAG="${REF#refs/tags/}"
          else
            IMAGE_TAG="$(git rev-parse --short=7 "$TARGET_SHA")"
          fi

          OWNER_LC="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"

          # Danh sách image: chỉ build những gì kiến trúc đã chọn thực sự dùng
          G='{"name":"gateway","file":"docker/Dockerfile.gateway"}'
          F='{"name":"frontend","file":"frontend/Dockerfile"}'
          E='{"name":"express","file":"docker/Dockerfile.express"}'
          P='{"name":"fastapi","file":"docker/Dockerfile.fastapi"}'
          A='{"name":"ai-service","file":"docker/Dockerfile.ai-service"}'
          U='{"name":"user-service","file":"docker/Dockerfile.user-service"}'
          S='{"name":"post-service","file":"docker/Dockerfile.post-service"}'
          M='{"name":"moderation-service","file":"docker/Dockerfile.moderation-service"}'
          N='{"name":"notification-service","file":"docker/Dockerfile.notification-service"}'
          case "$STRATEGY" in
            monolith)      LIST="$G,$F,$E,$P,$A" ;;
            microservices) LIST="$G,$F,$P,$A,$U,$S,$M,$N" ;;
            build-only)    LIST="$G,$F,$E,$P,$A,$U,$S,$M,$N" ;;
          esac

          {
            echo "deploy_env=$DEPLOY_ENV"
            echo "strategy=$STRATEGY"
            echo "run_migrations=$MIGRATE"
            echo "image_tag=$IMAGE_TAG"
            echo "image_prefix=ghcr.io/$OWNER_LC"
            echo "matrix={\"include\":[$LIST]}"
          } >> "$GITHUB_OUTPUT"

          echo "env=$DEPLOY_ENV strategy=$STRATEGY migrate=$MIGRATE tag=$IMAGE_TAG sha=$TARGET_SHA"

  # ========================================================
  # JOB 2: MIGRATION (CHỈ KHI CHỦ ĐỘNG BẬT, THỦ CÔNG)
  # ========================================================
  database-migration:
    name: 🗄️ Database Migration
    needs: prepare
    if: needs.prepare.outputs.run_migrations == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.deploy_env }}
    steps:
      - name: 📥 Tải mã nguồn
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: ⚙️ Cài đặt Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Cài đặt thư viện Backend
        working-directory: backend
        run: npm ci

      - name: 🚀 Chạy migration
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DATABASE_URL chưa được cấu hình cho environment này."
            exit 1
          fi
          # Lưu ý: migrate.js tự bắt lỗi và vẫn exit 0, hãy đọc log để xác nhận kết quả.
          npm run migrate

  # ========================================================
  # JOB 3: BUILD & PUSH IMAGE LÊN GHCR
  # ========================================================
  build-and-push:
    name: 🐳 Build ${{ matrix.name }}
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      IMAGE: ${{ needs.prepare.outputs.image_prefix }}/wings-${{ matrix.name }}
    steps:
      - name: 📥 Tải mã nguồn
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: ⚙️ Thiết lập Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Đăng nhập GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Tạo danh sách tag
        id: tags
        env:
          DEPLOY_ENV: ${{ needs.prepare.outputs.deploy_env }}
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
        run: |
          TAGS="$IMAGE:$IMAGE_TAG,$IMAGE:$DEPLOY_ENV"
          [ "$DEPLOY_ENV" = "production" ] && TAGS="$TAGS,$IMAGE:latest"
          echo "list=$TAGS" >> "$GITHUB_OUTPUT"

      # Frontend: URL API được "nướng" vào bundle. Để trống = cùng origin qua nginx proxy /api -> api-gateway
      # (đúng với frontend/nginx.conf). Chỉ đặt vars.PUBLIC_API_URL khi API nằm ở domain khác.
      - name: 🏗️ Build & Push (frontend)
        if: matrix.name == 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            VITE_API_URL=${{ vars.PUBLIC_API_URL }}
            VITE_FASTAPI_URL=${{ vars.PUBLIC_API_URL }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: 🏗️ Build & Push
        if: matrix.name != 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # ========================================================
  # JOB 4: TRIỂN KHAI LÊN MÁY CHỦ QUA SSH
  # ========================================================
  deploy:
    name: 🚀 Deploy (${{ needs.prepare.outputs.deploy_env }})
    needs: [prepare, database-migration, build-and-push]
    if: >
      !cancelled() &&
      needs.prepare.result == 'success' &&
      needs.build-and-push.result == 'success' &&
      (needs.database-migration.result == 'success' || needs.database-migration.result == 'skipped') &&
      needs.prepare.outputs.strategy != 'build-only'
    runs-on: ubuntu-latest
    # Secrets SERVER_* được cấu hình RIÊNG cho từng environment (staging / production)
    environment: ${{ needs.prepare.outputs.deploy_env }}
    env:
      HAS_SSH: ${{ secrets.SERVER_HOST != '' && secrets.SERVER_SSH_KEY != '' }}
      DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH || '/opt/wings' }}
    steps:
      - name: 📥 Tải mã nguồn
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: ℹ️ Chưa cấu hình SSH
        if: env.HAS_SSH != 'true'
        run: |
          echo "::notice::Image đã được push lên GHCR nhưng chưa deploy vì environment '${{ needs.prepare.outputs.deploy_env }}' thiếu secret SERVER_HOST / SERVER_SSH_KEY. Xem docs/deployment/cd-pipeline-guide.md"

      - name: 📤 Upload file compose
        if: env.HAS_SSH == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "docker-compose.yml,docker-compose.prod.yml,docker-compose.microservices.yml,docker-compose.microservices.prod.yml"
          target: ${{ env.DEPLOY_PATH }}

      - name: 📤 Upload script triển khai
        if: env.HAS_SSH == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "scripts/deploy.sh"
          target: ${{ env.DEPLOY_PATH }}/scripts
          strip_components: 1

      - name: 🚀 Chạy deploy (pull image, healthcheck, rollback khi lỗi)
        if: env.HAS_SSH == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_PREFIX: ${{ needs.prepare.outputs.image_prefix }}
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
          DEPLOY_MODE: ${{ needs.prepare.outputs.strategy }}
          HEALTH_URL: ${{ vars.HEALTH_URL }}
          AI_MODELS_ROOT: ${{ vars.AI_MODELS_ROOT }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 30m
          script_stop: true
          envs: GHCR_USER,GHCR_TOKEN,IMAGE_PREFIX,IMAGE_TAG,DEPLOY_MODE,HEALTH_URL,AI_MODELS_ROOT
          script: |
            set -euo pipefail
            cd "${{ env.DEPLOY_PATH }}"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            chmod +x scripts/deploy.sh
            [ -n "${AI_MODELS_ROOT:-}" ] && export AI_MODELS_ROOT
            ARGS=(--mode "$DEPLOY_MODE" --registry "$IMAGE_PREFIX" --tag "$IMAGE_TAG")
            [ -n "${HEALTH_URL:-}" ] && ARGS+=(--health-url "$HEALTH_URL")
            ./scripts/deploy.sh "${ARGS[@]}"

  # ========================================================
  # JOB 5: BÁO CÁO TỔNG HỢP
  # ========================================================
  summary:
    name: 📋 Báo cáo kết quả CD
    needs: [prepare, database-migration, build-and-push, deploy]
    if: always() && needs.prepare.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: 📝 Ghi báo cáo
        env:
          DEPLOY_ENV: ${{ needs.prepare.outputs.deploy_env }}
          STRATEGY: ${{ needs.prepare.outputs.strategy }}
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
          IMAGE_PREFIX: ${{ needs.prepare.outputs.image_prefix }}
          R_PREPARE: ${{ needs.prepare.result }}
          R_MIGRATE: ${{ needs.database-migration.result }}
          R_BUILD: ${{ needs.build-and-push.result }}
          R_DEPLOY: ${{ needs.deploy.result }}
        run: |
          OVERALL="✅ Thành công"
          for r in "$R_PREPARE" "$R_BUILD" "$R_DEPLOY" "$R_MIGRATE"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then OVERALL="❌ Thất bại"; fi
          done
          {
            echo "## 🚀 WINGS CD — $OVERALL"
            echo ""
            echo "| Mục | Giá trị |"
            echo "| :-- | :-- |"
            echo "| Môi trường | \`$DEPLOY_ENV\` |"
            echo "| Kiến trúc | \`$STRATEGY\` |"
            echo "| Commit | \`${TARGET_SHA::7}\` |"
            echo "| Image tag | \`$IMAGE_TAG\` |"
            echo "| Registry | \`$IMAGE_PREFIX\` |"
            echo "| Migration | \`$R_MIGRATE\` |"
            echo "| Build & Push | \`$R_BUILD\` |"
            echo "| Deploy | \`$R_DEPLOY\` |"
            echo "| Người kích hoạt | @${{ github.actor }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$OVERALL" = "✅ Thành công" ]
