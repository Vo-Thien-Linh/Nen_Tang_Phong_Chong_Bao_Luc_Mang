services:
  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    ports:
      - "5000:5000"
    environment:
      - GATEWAY_PORT=5000
      - PLATFORM_SERVICE_URL=http://fastapi-backend:8000
      - AI_SERVICE_URL=http://ai-service:8001
      - USER_SERVICE_URL=http://express-backend:5000
      - POST_SERVICE_URL=http://express-backend:5000
      - MODERATION_SERVICE_URL=http://express-backend:5000
      - REALTIME_SERVICE_URL=http://express-backend:5000
    depends_on:
      - fastapi-backend
      - ai-service
      - express-backend
    restart: always

  fastapi-backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.fastapi
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=development
    restart: always

  ai-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.ai-service
    expose:
      - "8001"
    environment:
      - AI_SERVICE_PORT=8001
      - BACKEND_APP_DIR=/app/backend
    depends_on:
      - fastapi-backend
    restart: always

  express-backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.express
    expose:
      - "5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=development
      - PORT=5000
      - FASTAPI_URL=http://fastapi-backend:8000
      - AI_SERVICE_URL=http://ai-service:8001
      - IMAGE_MODERATION_API_URL=http://ai-service:8001/api/v1/moderate/image
    depends_on:
      - fastapi-backend
      - ai-service
    restart: always

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-}
        VITE_FASTAPI_URL: ${PUBLIC_API_URL:-}
    ports:
      - "80:80"
    depends_on:
      - api-gateway
      - express-backend
      - fastapi-backend
    restart: always
